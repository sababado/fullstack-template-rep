# Alembic reads the database URL from core.config (DATABASE_URL locally), not
# from this file. Create a migration with:
#   uv run alembic revision --autogenerate -m "add widgets" --rev-id 0002
[alembic]
script_location = %(here)s/src/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
