# Local Postgres for development. Keep the major version in step with CI
# (.github/workflows/pr-checks.yml) and RDS (apps/backend/infra/database.yaml).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
